name: Build and Release

# Build the Windows executable and publish it as a GitHub release.
# Trigger by pushing a tag (e.g. `v0.6.1`) or by running it manually
# (uses the version from config.py).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        run: python -m PyInstaller metacheck.spec --noconfirm

      - name: Verify build
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist\ManuscriptChecker.exe')) {
            throw 'Build failed: dist\ManuscriptChecker.exe not found'
          }
          $size = (Get-Item 'dist\ManuscriptChecker.exe').Length
          Write-Host "Built exe size: $($size) bytes"
          if ($size -lt 1MB) {
            throw 'Built exe looks too small'
          }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $configVersion = (Select-String -Path 'config.py' -Pattern 'DESKTOP_APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            $tagVersion = $tag.TrimStart('v')
            if ($tagVersion -ne $configVersion) {
              throw "Release tag '$tag' does not match config.py DESKTOP_APP_VERSION '$configVersion'"
            }
          } else {
            $tag = "v$configVersion"
          }
          Write-Host "Creating release for tag $tag"
          gh release create $tag 'dist/ManuscriptChecker.exe' --title "MüCOS Manuscript Checker $tag" --generate-notes
